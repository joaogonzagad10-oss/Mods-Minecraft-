name: Compilar mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.4.2'

      - name: Descompactar projeto
        run: unzip -q ExpandableChests.zip -d src_proj

      - name: Compilar
        working-directory: src_proj/ExpandableChests
        run: gradle build --no-daemon

      - name: Publicar .jar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Baús Expansíveis build ${{ github.run_number }}
          files: src_proj/ExpandableChests/build/libs/*.jar
